<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PropPalace</title>
    <!-- The palace mark, three ways. The SVG is the one every current browser
         actually uses; the 32px PNG is the fallback for anything that will not
         take an SVG icon (Safari before 16), and the 180px one is what iOS
         puts on a home screen. Both PNGs are rendered from the same SVG, so
         there is one drawing to keep in step. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="description" content="Your own hit-rate research, before you place it. Player prop hit rates, matchup context and game logs for NFL, MLB, NBA and WNBA." />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PropPalace" />
    <meta property="og:title" content="PropPalace" />
    <meta property="og:description" content="Your own hit-rate research, before you place it. Player prop hit rates, matchup context and game logs for NFL, MLB, NBA and WNBA." />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PropPalace" />
    <meta name="twitter:description" content="Your own hit-rate research, before you place it. Player prop hit rates, matchup context and game logs for NFL, MLB, NBA and WNBA." />
    <!-- Fonts load in parallel from here rather than via an @import inside
         the stylesheet, which browsers cannot start fetching until the CSS
         itself has downloaded and parsed. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- One face, Inter, for display, body and numbers. The old trio
         (Bricolage Grotesque / Archivo / Space Mono) read soft and uneven at
         small sizes; Inter with tabular figures is crisp at 10-13px. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
