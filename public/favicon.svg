<!--
  The crown mark (see src/PalaceMark.jsx), as the tab icon. Same drawing as
  the "nav" variant: a green tile with three bars and a band cut out of it,
  and the dashed line on the band's top edge.

  NOTE ON COMMENTS IN THIS FILE: no double hyphen anywhere inside one. XML
  forbids it; a parse error means the browser gets no icon at all and the tab
  falls back to the generated letter tile. Use an em dash or a comma instead.

  The colours are literal hexes, not tokens. An SVG loaded via a link
  rel="icon" gets no page CSS, so there are no custom properties to read and
  no theme to follow. The tile is always green, so the cutouts take the dark
  theme's ground and the icon is identical whatever the browser chrome is.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32">
  <rect width="64" height="64" rx="14" fill="#3ecf8e"/>
  <rect x="12" y="26" width="11" height="20" rx="3.5" fill="#0a0b0d"/>
  <rect x="26.5" y="13" width="11" height="33" rx="3.5" fill="#0a0b0d"/>
  <rect x="41" y="26" width="11" height="20" rx="3.5" fill="#0a0b0d"/>
  <rect x="9" y="44" width="46" height="10" rx="3.5" fill="#0a0b0d"/>
  <line x1="4" y1="44" x2="60" y2="44" stroke="#3ecf8e" stroke-width="2.6" stroke-dasharray="4.5 3.5"/>
</svg>
