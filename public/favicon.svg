<!--
  The palace mark (see src/PalaceMark.jsx), redrawn as SVG for the tab icon.
  Same five towers, same green/red split, same dashed line and pennant.

  Two things differ from the DOM version on purpose:

  * The whole mark is scaled up and centred in a 32x32 box with a dark ground
    behind it, because a browser tab renders this at ~16px against whatever
    colour the user's chrome happens to be. The old "P" on a lapis ring is
    gone with the three-bar mark it belonged to.
  * The colours are literal hexes, not tokens. An SVG loaded via <link
    rel="icon"> gets no page CSS, so there are no custom properties to read
    and no theme to follow -- these are the dark-theme values, which is what
    the ground behind them is.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0d0f12"/>
  <!-- Towers, on a shared baseline at y=27. Left wing and right wing are
       outlined red with no bottom edge; the three inner towers are solid
       green. Widths 4, gaps 1.5. -->
  <path d="M4.75 19.75 v-4 a1 1 0 0 1 1 -1 h2 a1 1 0 0 1 1 1 v4"
        fill="none" stroke="#ef5b5b" stroke-width="1.5"/>
  <rect x="10.25" y="12" width="4" height="15" rx="1" fill="#3ecf8e"/>
  <rect x="15.75" y="7"  width="4" height="20" rx="1" fill="#3ecf8e"/>
  <rect x="21.25" y="12" width="4" height="15" rx="1" fill="#3ecf8e"/>
  <path d="M26.75 19.75 v-4 a1 1 0 0 1 1 -1 h2 a1 1 0 0 1 1 1 v4"
        fill="none" stroke="#ef5b5b" stroke-width="1.5"/>
  <!-- Mast and pennant on the keep. -->
  <rect x="16.9" y="2.5" width="1.6" height="5" fill="#3ecf8e"/>
  <path d="M18.5 2.6 L23.6 4.6 L18.5 6.6 Z" fill="#3ecf8e"/>
  <!-- The line, overhanging both wings. -->
  <line x1="2.5" y1="19.75" x2="29.5" y2="19.75"
        stroke="#e8ecf2" stroke-width="1.5" stroke-dasharray="2.5 2"/>
</svg>
