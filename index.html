    <!-- Fonts load in parallel from here rather than via an @import inside
         the stylesheet, which browsers cannot start fetching until the CSS
         itself has downloaded and parsed. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The three faces of the v2 type system, and only those: Bricolage
         Grotesque for display, Archivo for body, Space Mono for every number
         and every uppercase micro-label.

         The previous URL returned HTTP 400 and therefore loaded NOTHING -- not
         Bricolage, not Archivo, not Space Mono. Bricolage is a two-axis
         variable font, and `opsz,wght@12..96,400;600;700;800` mixes a range on
         one axis with a list on the other, which is not valid tuple syntax.
         One malformed family fails the whole css2 request, so every face in it
         silently fell back to a system font. Ranges on both axes, or discrete
         tuples -- never one of each. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Space+Mono:wght@400;700&display=swap"
    />
